      <stop offset="0" stop-color="#07111E"/><stop offset="1" stop-color="#150C2B"/>
    </linearGradient>
    <pattern id="c-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1B2638" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="1199" height="447" rx="22" fill="url(#c-bg)" stroke="#23324A"/>
  <rect x=".5" y=".5" width="1199" height="447" rx="22" fill="url(#c-grid)"/>

  <rect x="36.0" y="36" width="362.7" height="178" rx="16" fill="#0B1220" stroke="#22314A"/>
