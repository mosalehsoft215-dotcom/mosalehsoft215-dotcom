  <circle cx="68.0" cy="276" r="3.2" fill="#2DD4BF"/>
  <text x="90.0" y="281" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2" text-anchor="start">MACHINE LEARNING &amp; NLP</text>
  <text x="60.0" y="326" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">From classical ML to deep learning:</text>
  <text x="60.0" y="349" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">classification, prediction, language</text>
  <text x="60.0" y="372" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">pipelines and model evaluation.</text>
  <rect x="418.7" y="234" width="362.7" height="178" rx="16" fill="#0B1220" stroke="#22314A"/>
