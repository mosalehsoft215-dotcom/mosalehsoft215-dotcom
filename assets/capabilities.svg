  <text x="90.0" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2" text-anchor="start">AGENTIC AI SYSTEMS</text>
  <text x="60.0" y="128" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">Multi-agent orchestration, planning,</text>
  <text x="60.0" y="151" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">memory and tool use, wired to real</text>
  <text x="60.0" y="174" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">APIs through MCP, GraphQL and REST.</text>
  <rect x="418.7" y="36" width="362.7" height="178" rx="16" fill="#0B1220" stroke="#22314A"/>
  <rect x="418.7" y="36" width="362.7" height="4" rx="2" fill="#4D7CFE"/>
