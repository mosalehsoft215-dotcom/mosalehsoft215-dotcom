<svg width="1200" height="448" viewBox="0 0 1200 448" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What I build</title>
  <desc id="desc">Agentic Ai Systems; Document Intelligence; Computer Vision; Machine Learning &amp; Nlp; Data Engineering; Ai Evaluation</desc>
  <defs>
