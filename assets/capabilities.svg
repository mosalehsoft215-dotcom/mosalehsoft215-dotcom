  <circle cx="833.3" cy="276" r="10" fill="#F472B6" fill-opacity=".16" stroke="#F472B6"/>
  <circle cx="833.3" cy="276" r="3.2" fill="#F472B6"/>
  <text x="855.3" y="281" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2" text-anchor="start">AI EVALUATION</text>
  <text x="825.3" y="326" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">Benchmarks, expert test sets and</text>
  <text x="825.3" y="349" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">LLM and VLM evaluation that show</text>
  <text x="825.3" y="372" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">whether a model is ready to ship.</text>
