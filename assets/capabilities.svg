  <circle cx="450.7" cy="276" r="3.2" fill="#FBBF24"/>
  <text x="472.7" y="281" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2" text-anchor="start">DATA ENGINEERING</text>
  <text x="442.7" y="326" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">Large-scale entity resolution,</text>
  <text x="442.7" y="349" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">deduplication, acquisition and</text>
  <text x="442.7" y="372" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">automated pipelines that stay clean.</text>
  <rect x="801.3" y="234" width="362.7" height="178" rx="16" fill="#0B1220" stroke="#22314A"/>
