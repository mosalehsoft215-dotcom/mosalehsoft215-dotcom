  <text x="472.7" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="700" fill="#F8FAFC" letter-spacing="1.2" text-anchor="start">DOCUMENT INTELLIGENCE</text>
  <text x="442.7" y="128" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8" letter-spacing="0" text-anchor="start">OCR, layout and field extraction from</text>
