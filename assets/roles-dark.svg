<svg width="1000" height="48" viewBox="0 0 1000 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What I do</title>
  <desc id="desc">Agentic AI systems / Document intelligence / Computer vision / AI evaluation &amp; benchmarks</desc>
  <style>
    .role { opacity: 0; animation: role 12s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes role { 0% { opacity: 0; transform: translateY(10px); } 3% { opacity: 1; transform: translateY(0); } 22.0% { opacity: 1; transform: translateY(0); } 25.0%, 100% { opacity: 0; transform: translateY(-10px); } }
    .caret { animation: caret 1s steps(1) infinite; }  @keyframes caret { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .role { animation: none; } .role.r0 { opacity: 1; } .caret { animation: none; } }
  </style>
  <text x="490.0" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2DD4BF" letter-spacing="2.4" text-anchor="end">AI ENGINEER  /</text>
  <g class="role r0" style="animation-delay:-0.5s"><text x="506.0" y="32" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="0" text-anchor="start">Agentic AI systems</text></g>
  <g class="role r1" style="animation-delay:2.5s"><text x="506.0" y="32" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="0" text-anchor="start">Document intelligence</text></g>
  <g class="role r2" style="animation-delay:5.5s"><text x="506.0" y="32" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="0" text-anchor="start">Computer vision</text></g>
  <g class="role r3" style="animation-delay:8.5s"><text x="506.0" y="32" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" letter-spacing="0" text-anchor="start">AI evaluation &amp; benchmarks</text></g>
  <rect class="caret" x="808" y="12" width="3" height="26" rx="1.5" fill="#F0883E" opacity="0"/>
</svg>
