  <text x="818.7" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="0.8" text-anchor="start">SHIP</text>
