name: Refresh profile counts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw assets from live counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh.py

      - name: Commit when the counts changed
        run: |
          if [ -z "$(git status --porcelain assets data)" ]; then
            echo "Counts unchanged."
            exit 0
          fi
          git config user.name "mosalehsoft215-dotcom"
          git config user.email "mosalehsoft215-dotcom@users.noreply.github.com"
          git add assets data
          git commit -m "Refresh live counts"
          git push
